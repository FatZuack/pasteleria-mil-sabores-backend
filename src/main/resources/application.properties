# Puerto local de la API
server.port=8080

# Base de datos H2 en archivo local (mantiene datos al reiniciar)
spring.datasource.url=jdbc:h2:file:./data/pasteleria-dev
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza automáticamente las 5 tablas según las entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 y Swagger habilitados en desarrollo para pruebas y capturas de EP3
spring.h2.console.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true