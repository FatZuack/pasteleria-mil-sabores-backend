# En EC2 solo escucha internamente; Nginx (puerto 80) hace el proxy hacia aquí
server.address=127.0.0.1
server.port=8080

# Persistencia en archivo dentro de WorkingDirectory (/home/ubuntu/pasteleria/data)
spring.datasource.url=jdbc:h2:file:./data/pasteleria
spring.jpa.hibernate.ddl-auto=update

# Consola H2 desactivada en producción; Swagger se deja habilitado para la evaluación si se revisa en EC2
spring.h2.console.enabled=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true